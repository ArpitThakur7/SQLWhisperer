name: CI & Accuracy Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Security (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit & integration tests
        env:
          OPENAI_API_KEY: "test-ci-key-do-not-use"
          DATABASE_URL: "sqlite:///./data/test.db"
          HISTORY_DB_URL: "sqlite:///:memory:"
        run: |
          pytest tests/ -v --tb=short

      - name: Run offensive security & sandbox tests
        run: |
          pytest tests/test_security.py -v

      - name: Run golden dataset accuracy evaluation gate
        run: |
          pytest tests/eval/test_benchmark.py -v
